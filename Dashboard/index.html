<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Project & Employee Manager</title>
		<link rel="stylesheet" href="./css/styles.css">
</head>

<body>
 <!-- LEFT SIDEBAR -->
    <div id="side-panel">
        <button id="toggle-button">&#9776;</button>
        <div class="month-selector">
            <h3>Period</h3>
            <select id="month-select"></select>
            <select id="year-select"></select>
        </div>
        <nav>
            <a href="#" id="nav-projects" class="nav-item active">Projects</a>
            <a href="#" id="nav-employees" class="nav-item">Employees</a>
        </nav>
    </div>
    <button id="open-button" class="hidden">&#8250;</button>
<!-- Project -->
	<div id="main-content">
		<div id="projects-content">
			<div class="content-header">
				<h1 class="project-text">Projects</h1>
				<div>
					<button id="add-project-btn" class="add-btn">+ Add Project</button>
					<button id="seed-data-btn" class="add-btn">Seed Data</button>
				</div>
			</div>
			
			<table id="projects-table">
                <thead id="projects-thead">
                    <tr>
                        <th data-sort="companyName" data-filter="companyName" class="sortable filterable">Company Name <span class="sort-icon">⇅</span><span class="filter-icon">⌕</span></th>
                        <th data-sort="projectName" data-filter="projectName" class="sortable filterable">Project Name <span class="sort-icon">⇅</span><span class="filter-icon">⌕</span></th>
                        <th data-sort="budget" class="sortable">Budget <span class="sort-icon">⇅</span></th>
                        <th data-sort="employeeCapacity" class="sortable">Employee Capacity <span class="sort-icon">⇅</span></th>
                        <th>Employees</th>
                        <th data-sort="estimatedIncome" class="sortable">Estimated Income <span class="sort-icon">⇅</span></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projects-tbody"></tbody>
            </table>
        </div>
	</div>

	<script type="module" src="./JS/main.js"></script>
</body>
</html>
